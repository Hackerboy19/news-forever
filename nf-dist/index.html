         Both still load with the same IDs and still record the page view, but
         they are attached after first paint instead of competing with the app
         bundle for a throttled mobile CPU. On a Moto-G-class phone the two
         tag scripts were occupying the main thread for ~2s inside the window
         that decides LCP. dataLayer is created now, so anything queued before
         the scripts attach is replayed when they load. -->
